global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.mailgun.org:587'
  smtp_from: 'alerts@lifelink.org'
  smtp_auth_username: 'postmaster@lifelink.org'
  smtp_auth_password: 'smtp_auth_password_here'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-slack-receiver'
  routes:
    # Route critical alerts to PagerDuty & Slack
    - match:
        severity: critical
      receiver: 'critical-pagerduty-receiver'
      continue: true
    # Route all warnings to Slack, Teams, and Email
    - match:
        severity: warning
      receiver: 'warning-multi-receiver'

receivers:
  # 1. Default Slack Receiver
  - name: 'default-slack-receiver'
    slack_configs:
      - api_url: 'http://localhost/slack-webhook-placeholder'
        channel: '#lifelink-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: 'Description: {{ .CommonAnnotations.description }}'

  # 2. Critical Outage Receiver (PagerDuty + Slack)
  - name: 'critical-pagerduty-receiver'
    slack_configs:
      - api_url: 'http://localhost/slack-webhook-placeholder'
        channel: '#lifelink-critical-alerts'
        send_resolved: true
    pagerduty_configs:
      - service_key: 'PAGERDUTY_INTEGRATION_KEY_HERE'
        send_resolved: true
        severity: 'critical'

  # 3. Warnings Receiver (Slack + MS Teams + Email)
  - name: 'warning-multi-receiver'
    slack_configs:
      - api_url: 'http://localhost/slack-webhook-placeholder'
        channel: '#lifelink-warnings'
        send_resolved: true
    webhook_configs:
      # MS Teams Webhook connector
      - url: 'https://lifelink.webhook.office.com/webhookb2/teams-integration-endpoint'
        send_resolved: true
    email_configs:
      - to: 'sre-team@lifelink.org'
        send_resolved: true
