apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend-api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: DATABASE_URL
            - name: DATABASE_URL_REPLICA
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: DATABASE_URL_REPLICA
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: ENCRYPTION_KEYS
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: GOOGLE_MAPS_API_KEY
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: SMTP_PASS
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: SENTRY_DSN
            - name: PORT
              value: "{{ .Values.backend.service.port }}"
            - name: NODE_ENV
              value: "{{ .Values.global.environment }}"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
