apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lifelink-external-secret
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: lifelink-secret-store
    kind: SecretStore
  target:
    name: lifelink-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: lifelink/production/secrets
        property: DATABASE_URL
    - secretKey: DATABASE_URL_REPLICA
      remoteRef:
        key: lifelink/production/secrets
        property: DATABASE_URL_REPLICA
    - secretKey: REDIS_URL
      remoteRef:
        key: lifelink/production/secrets
        property: REDIS_URL
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: lifelink/production/secrets
        property: RABBITMQ_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: lifelink/production/secrets
        property: JWT_SECRET
    - secretKey: ENCRYPTION_KEYS
      remoteRef:
        key: lifelink/production/secrets
        property: ENCRYPTION_KEYS
    - secretKey: GOOGLE_MAPS_API_KEY
      remoteRef:
        key: lifelink/production/secrets
        property: GOOGLE_MAPS_API_KEY
    - secretKey: SMTP_USER
      remoteRef:
        key: lifelink/production/secrets
        property: SMTP_USER
    - secretKey: SMTP_PASS
      remoteRef:
        key: lifelink/production/secrets
        property: SMTP_PASS
    - secretKey: TWILIO_ACCOUNT_SID
      remoteRef:
        key: lifelink/production/secrets
        property: TWILIO_ACCOUNT_SID
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: lifelink/production/secrets
        property: TWILIO_AUTH_TOKEN
    - secretKey: SENTRY_DSN
      remoteRef:
        key: lifelink/production/secrets
        property: SENTRY_DSN
