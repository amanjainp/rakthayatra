# Default values configurations for lifelink.

# ----------------------------------------------------
# GLOBAL DEFINITIONS
# ----------------------------------------------------
global:
  environment: production
  domainName: lifelink.org

# ----------------------------------------------------
# BACKEND API DEPLOYMENT
# ----------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: lifelink-backend
    pullPolicy: IfNotPresent
    tag: "prod-latest"
  service:
    type: ClusterIP
    port: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  secrets:
    jwtSecret: "DUMMY_JWT_SECRET_TO_BE_OVERRIDDEN"
    dbUrl: "postgresql://user:password@localhost:5432/db"
    redisUrl: "redis://localhost:6379"
    rabbitmqUrl: "amqp://localhost:5672"
    encryptionKeys: "dev-key-must-be-32-characters-long-!"
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
    googleMapsApiKey: ""
    firebaseProjectId: ""
    firebaseClientEmail: ""
    firebasePrivateKey: ""

# ----------------------------------------------------
# FRONTEND CLIENT DEPLOYMENT
# ----------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: lifelink-frontend
    pullPolicy: IfNotPresent
    tag: "prod-latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

# ----------------------------------------------------
# INGRESS & TLS
# ----------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: lifelink.org
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - secretName: lifelink-tls-certs
      hosts:
        - lifelink.org

# ----------------------------------------------------
# OBSERVABILITY & MONITORING
# ----------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: prometheus-operator
