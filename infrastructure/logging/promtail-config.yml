server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Express Backend Service logs Scraper
  - job_name: lifelink-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: lifelink-backend
          env: production
          __path__: /app/logs/*.log

    pipeline_stages:
      # Parse JSON log payloads to capture levels, timestamps, requestIds, and correlationIds
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            requestId: requestId
            correlationId: correlationId
            service: service

      # Map parsed labels to prometheus logs stream indexes
      - labels:
          level:
          requestId:
          correlationId:
          service:
