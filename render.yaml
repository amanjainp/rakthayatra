version: "1"

databases:
  - name: rakthayatra-db
    databaseName: rakthayatra
    user: rakthayatra_user
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # Backend API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: rakthayatra-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --skip-generate && node prisma/seed-prod.js && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rakthayatra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEYS
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info

  # ---------------------------------------------------------------------------
  # Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: rakthayatra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rakthayatra-backend.onrender.com
